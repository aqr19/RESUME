name: APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Decode Signing Keystore
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/signing.jks"

      - name: Build Release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x ./gradlew && ./gradlew :app:assembleRelease --no-daemon

      - name: Clean up Signing Keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/signing.jks"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTXTube-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
