name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Unit Tests & Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run Unit Tests & Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK Metadata
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" | sort -V | tail -n 1)
          INFO=$("$AAPT2" dump badging "$APK")
          echo "$INFO" | grep -q "name='com.tensei.ytxtube.app'" || { echo "::error::Invalid applicationId"; exit 1; }
          echo "$INFO" | grep -q "versionCode='[0-9]" || { echo "::error::Missing versionCode"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: YTXTube-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
