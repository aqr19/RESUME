name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Build, Verify & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Tag & Check Duplicate Release
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Invalid tag format: $TAG"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo "::error::Release $TAG already exists"; exit 1; }
          VER="${TAG#v}"
          [[ "$TAG" == *-* ]] && PRE="true" || PRE="false"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "apk=RESUME-v${VER}.apk" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate & Decode Signing Keystore
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$K_ALIAS" ] || [ -z "$K_PASS" ]; then
            echo "::error::Missing required signing secrets (SIGNING_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "${RUNNER_TEMP}/signing.jks"
          keytool -list -keystore "${RUNNER_TEMP}/signing.jks" -storepass "$KS_PASS" -alias "$K_ALIAS" >/dev/null || { echo "::error::Invalid keystore or alias credentials."; exit 1; }
      - name: Run Unit Tests & Build Signed Release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
      - name: Clean up Keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/signing.jks"
      - name: Verify APK & Generate Checksums
        id: verify
        run: |
          APK="${{ steps.meta.outputs.apk }}"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          BADGE=$("$BT/aapt2" dump badging "$APK")
          PKG=$(echo "$BADGE" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          VC=$(echo "$BADGE" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          VN=$(echo "$BADGE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          [ "$PKG" = "com.tensei.resume.app" ] || { echo "::error::Expected com.tensei.resume.app, got $PKG"; exit 1; }
          [ -n "$VC" ] && [ -n "$VN" ] || { echo "::error::Missing versionCode or versionName"; exit 1; }
          CERT=$("$BT/apksigner" verify --verbose --print-certs "$APK")
          echo "$CERT" | grep -qi "Android Debug" && { echo "::error::Signed with Debug key!"; exit 1; }
          FP=$(echo "$CERT" | sed -n "s/^Signer #1 certificate SHA-256 digest: //p" | head -n 1)
          [ -n "$FP" ] || { echo "::error::Missing certificate fingerprint"; exit 1; }
          sha256sum "$APK" > "${APK}.sha256"
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
          echo "fp=$FP" >> "$GITHUB_OUTPUT"
          echo "sha=$(awk '{print $1}' "${APK}.sha256")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk }}
          path: |
            ${{ steps.meta.outputs.apk }}
            ${{ steps.meta.outputs.apk }}.sha256
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: RESUME ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.meta.outputs.apk }}
            ${{ steps.meta.outputs.apk }}.sha256
          body: |
            - **Application ID**: `com.tensei.resume.app`
            - **Version**: `${{ steps.verify.outputs.vn }}` (`${{ steps.verify.outputs.vc }}`)
            - **APK SHA-256**: `${{ steps.verify.outputs.sha }}`
            - **Certificate SHA-256**: `${{ steps.verify.outputs.fp }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
